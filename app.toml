# server-defender —— 由 postsup 统一纳管（go-single 单二进制部署）
# 部署对齐原则：supervisor 与 postsup 均指向 bin/server-defender（见 skill/memory.md 2026-09-03 铁律）
name = "server-defender"
version = "v3.1.0"
deploy_type = "go-single"
supervisor_service = "psup-server-defender"
deploy_user = "root"

[go_single]
  binary = "bin/server-defender"
  stop_first = true

[build]
  command = "go build -o bin/server-defender ."
  output_bin = "bin/server-defender"

[deploy]
  command = "/main/app/github/postsup/apps/server-defender/bin/server-defender"
  user = "root"
  log_file = "/main/log/app/server-defender.log"