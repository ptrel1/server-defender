# server-defender supervisor 配置模板
# 由 deploy/deploy.sh 替换 @DIR@（包实际位置）/ @USER@（运行用户）/ @BIN@（运行载体绝对路径）
# 后安装到 supervisor 的 include 目录。**目录放哪都对**——路径按包实际位置生成。
#
# ⚠️ 本项目**不解析命令行参数、无配置文件**（端口 8899 等为代码内默认值），
#    故 command 不带 --config —— 传参会启动失败。已按生产实际对齐。
[program:psup-server-defender]
command=@BIN@
directory=@DIR@
user=@USER@
autostart=true
autorestart=true
startsecs=3
startretries=3
redirect_stderr=true
stdout_logfile=/main/log/app/server-defender.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/main/log/app/server-defender.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=HOME="@HOME@"
