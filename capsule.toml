# 部署胶囊协议 v1 —— server-defender
# 规范真源：ptrelskill cross/capsule-protocol.md
# 契约是构建/校验的**唯一事实源**：scripts/capsule-build.sh 与 deploy/deploy.sh 均据此工作。
schema  = "psup-capsule/v1"
app     = "server-defender"
version = "v3.8.0"

[deploy]
type         = "go-single"
service      = "psup-server-defender"
conf         = "server-defender.conf"
script       = "deploy.sh"
user_default = "root"
port         = 8899
requires     = ["supervisor"]
entry        = "bin/server-defender"

# 平台列表（可选扩展点）：本项目纯标准库 + go:embed，CGO_ENABLED=0 可交叉编译。
[platforms]
linux-amd64 = "bin/linux-amd64/server-defender"
linux-arm64 = "bin/linux-arm64/server-defender"

[config]
# 本项目**无配置文件**（端口等为代码内默认值，也不解析 flag）→ template 留空。
# 注意：留空时协议校验会给出 warn（提示缺少配置模板），对本项目属预期。
template            = ""
secret              = false
generate_if_absent  = false

[build]
# 版本注入：本项目未用 -X 注入（版本记录在 app.toml 的 version）。
# 前端已 go:embed 进二进制（无需随包静态资源）。
ldflags = "-s -w"
cmd     = "."
