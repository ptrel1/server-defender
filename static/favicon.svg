<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：深邃深空蓝黑 -->
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050911" />
    </linearGradient>
    <!-- 盾牌外轮廓科技蓝到极客青渐变 -->
    <linearGradient id="shieldGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
    <!-- 盾牌内衬渐变 -->
    <linearGradient id="innerShieldA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.95" />
    </linearGradient>
    <!-- 闪电能量渐变 -->
    <linearGradient id="boltGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <!-- 柔光滤镜 -->
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple 风格圆角底板 (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradA)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- 外层防御光环（微弱发光） -->
  <path d="M64 22 C84 22 100 28 100 28 C100 68 84 94 64 106 C44 94 28 68 28 28 C28 28 44 22 64 22 Z" 
        fill="none" stroke="url(#shieldGradA)" stroke-width="6" opacity="0.3" filter="url(#glowA)" />

  <!-- 主体盾牌 -->
  <path d="M64 25 C82 25 96 30 96 30 C96 66 82 90 64 102 C46 90 32 66 32 30 C32 30 46 25 64 25 Z" 
        fill="url(#innerShieldA)" stroke="url(#shieldGradA)" stroke-width="3.5" />

  <!-- 盾牌中缝立体分割线 -->
  <path d="M64 26 L64 101" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- 核心闪电（象征实时自愈与安全拦截） -->
  <polygon points="66,38 48,64 62,64 58,88 80,58 66,58" fill="url(#boltGradA)" filter="url(#glowA)" />
</svg>